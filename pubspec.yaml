name: conquest
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.5.1

#-------------------PACKAGES---------------#
dependencies:
  flutter:
    sdk: flutter
  # Utility Packages
  http: ^1.1.0
  intl: ^0.19.0
  flutter_native_splash: ^2.3.1
  shimmer: ^3.0.0
  loading_indicator: ^3.1.1
  carousel_slider: ^5.0.0
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1
  page_transition: ^2.1.0
  favorite_button: ^0.0.4
  readmore:
  flutter_rating_bar:
  #animated_notch_bottom_bar:
  bottom_nav_layout:


  # Firebase Packages
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.0.3
  google_sign_in: ^6.2.1

  # State Management
  get: ^4.6.6

  # Product Specific
  #readmore: ^2.2.0
  #carousel_slider: ^4.2.1
  #flutter_rating_bar: ^4.0.1
  #capped_progress_indicator: ^0.0.2

#-------------------PACKAGES END---------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true

  #-------------------LOCAL ASSETS---------------#
  assets:
    - assets/logos/
    - assets/icons/appicons/
    - assets/icons/drawerIcons/
    - assets/icons/bottomNavbaricons/InactiveIcons/
    - assets/icons/bottomNavbaricons/activeIcons/
    - assets/Banners/



#-------------------LOCAL FONTS---------------#
fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Light.ttf
        weight: 300
      - asset: assets/fonts/Poppins-Regular.ttf
        weight: 400
      - asset: assets/fonts/Poppins-Italic.ttf
        style: italic
      - asset: assets/fonts/Poppins-Medium.ttf
        weight: 500
      - asset: assets/fonts/Poppins-MediumItalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/Poppins-SemiBold.ttf
        weight: 500
      - asset: assets/fonts/Poppins-Bold.ttf
        weight: 800




























